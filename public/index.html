<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#3b2a20">
<title>Popotte café</title>
<style>
:root{
  --bg:#f6f1ea; --card:#fff; --ink:#2a1e17; --muted:#7a6a5e; --line:#e4d9cc;
  --brand:#6b4226; --brand-ink:#fff; --cafe:#7b4a2a; --eau:#1f6f8b; --soft:#a33a5c;
  --ok:#2e7d4f; --warn:#b3541e; --danger:#b42318;
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#17120f; --card:#231b16; --ink:#f3ebe3; --muted:#b3a497; --line:#3a2e26;
    --brand:#c98a5a; --brand-ink:#1b120c; --cafe:#c98a5a; --eau:#5bb6d6; --soft:#e07a9c; --ok:#5cc58a; --warn:#e3925a; --danger:#ef6b5f; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;background:var(--brand);color:var(--brand-ink);position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:22px;letter-spacing:.3px}
header .sub{font-size:13px;opacity:.85}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 18px;background:var(--line);color:var(--ink)}
button:active{transform:scale(.97)}
button.primary{background:var(--brand);color:var(--brand-ink)}
button.ghost{background:transparent;border:1px solid currentColor;color:inherit}
button.ok{background:var(--ok);color:#fff}
button.danger{background:var(--danger);color:#fff}
button.small{padding:8px 12px;font-size:14px;border-radius:10px}
input,select{font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%}
label{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.member{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:120px}
.member .name{font-size:20px;font-weight:600}
.member .tag{font-size:12px;color:var(--brand);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.member .due{font-size:26px;font-weight:700;margin-top:auto}
.member .due.zero{color:var(--ok)}
.member .meta{font-size:13px;color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px}
.panel h2{margin:0 0 12px;font-size:20px}
.big-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:16px 0}
.big-actions button{padding:30px 10px;font-size:24px;font-weight:700;border-radius:20px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:6px}
.big-actions .cafe{background:var(--cafe)} .big-actions .eau{background:var(--eau)} .big-actions .soft{background:var(--soft)}
.big-actions small{font-size:16px;font-weight:500;opacity:.9}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--bg);border-radius:12px;padding:14px}
.stat .v{font-size:28px;font-weight:700}
.stat .l{font-size:13px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
th{font-size:13px;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tabs button.active{background:var(--brand);color:var(--brand-ink)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:14px 22px;border-radius:14px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
.modal-bg{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal{background:var(--card);border-radius:var(--r);padding:22px;width:100%;max-width:420px}
.modal h3{margin:0 0 8px}
.hint{font-size:13px;color:var(--muted)}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600}
.pill.cafe{background:color-mix(in srgb,var(--cafe) 18%,transparent);color:var(--cafe)}
.pill.eau{background:color-mix(in srgb,var(--eau) 18%,transparent);color:var(--eau)}
.pill.soft{background:color-mix(in srgb,var(--soft) 18%,transparent);color:var(--soft)}
.pill.pay{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.hidden{display:none!important}
/* Accueil compact : toutes les tuiles tiennent dans l'écran, sans défiler */
body.accueil{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
body.accueil main{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;padding:10px 10px 10px}
body.accueil #app{flex:1;min-height:0;display:flex;flex-direction:column}
.avatar{flex:none;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg);border:2px solid var(--line);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.init{font-size:17px;font-weight:700;color:#fff;border:0}
.avatar.sm{width:36px;height:36px;font-size:14px}
.home .member{flex-direction:row!important;align-items:center;justify-content:flex-start!important;gap:10px!important;min-width:0;overflow:hidden;padding:6px 10px!important}
.home .member .txt{display:flex;flex-direction:column;min-width:0;flex:1}
.home .member .meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow{display:flex;align-items:center;gap:10px}
@media (min-width:600px){ .avatar:not(.sm){width:58px;height:58px} .avatar.init:not(.sm){font-size:21px} }
@media (min-width:900px){ .avatar:not(.sm){width:72px;height:72px} .avatar.init:not(.sm){font-size:26px} }
@media (max-width:599px){ .avatar:not(.sm){width:40px;height:40px} .avatar.init:not(.sm){font-size:15px} .home .member .due.wait{font-size:12px} .home .member .name{font-size:15px} }
.home-title{margin:0 0 8px;font-size:16px;color:var(--muted);font-weight:600}
.grid.home{flex:1;min-height:0;overflow-y:auto;gap:8px;grid-template-columns:repeat(2,1fr);grid-auto-rows:minmax(54px,150px);align-content:start}
.home .member{min-height:0;padding:6px 12px;gap:0;justify-content:center;border-radius:12px}
.home .member .name{font-size:16px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.home .member .star{color:var(--brand);font-size:12px;font-weight:700;margin-left:4px}
.home .member .due{font-size:16px;margin-top:0;line-height:1.25}
.home .member .due.wait{font-size:14px}
.home .member .meta{display:none}
@media (min-width:600px){ .grid.home{grid-template-columns:repeat(3,1fr);gap:10px} }
@media (min-width:900px){
  .grid.home{grid-template-columns:repeat(4,1fr)}
  .home .member .name{font-size:19px} .home .member .due{font-size:21px}
}
@media (min-width:900px) and (min-height:650px){ .home .member .meta{display:block;font-size:12px} }
@media (max-width:599px){
  header{padding:8px 12px} header h1{font-size:18px} header .sub{font-size:11px}
  header button.small{padding:6px 9px;font-size:13px}
}
.member .due.wait{color:var(--warn);font-size:18px}
.badge{display:inline-block;min-width:20px;padding:1px 6px;margin-left:6px;border-radius:99px;background:var(--danger);color:#fff;font-size:12px;font-weight:700;text-align:center}
.payzone{border-style:dashed;margin-top:28px}
.payzone .row{align-items:center}
.notif{border:2px solid var(--warn)}
.notif li{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.notif ul{list-style:none;margin:0;padding:0}
button.ok-outline{background:transparent;border:2px solid var(--ok);color:var(--ok);font-weight:600}
@media print{
  header,.no-print,.tabs{display:none!important}
  body{background:#fff;color:#000}
  .panel{border:0;padding:0}
  main{padding:0}
}
</style>
</head>
<body>
<header>
  <div>
    <h1>☕ Popotte café</h1>
    <div class="sub" id="hdrSub"></div>
  </div>
  <div class="row no-print">
    <button class="ghost small" id="btnHome">Accueil</button>
    <button class="ghost small" id="btnAdmin">Gestionnaire</button>
  </div>
</header>
<main id="app"></main>
<div class="toast" id="toast"></div>

<script>
/* Compatibilité avec les tablettes plus anciennes */
if(!Object.fromEntries) Object.fromEntries=function(l){var o={};Array.from(l).forEach(function(e){o[e[0]]=e[1];});return o;};
/* Les données sont stockées sur Netlify (fonction /api + Netlify Blobs).
   Les noms et prix de départ se règlent dans netlify/functions/api.mjs,
   puis dans l'espace Gestionnaire. */

const $ = s => document.querySelector(s);
const app = $("#app");
const euro = n => (Math.round(n*100)/100).toLocaleString("fr-FR",{style:"currency",currency:"EUR"});
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const monthKey = ts => { const d=new Date(ts); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); };
const monthLabel = k => { const [y,m]=k.split("-"); return new Date(+y,+m-1,1).toLocaleDateString("fr-FR",{month:"long",year:"numeric"}); };
const PRODUITS = [
  {k:"cafe", nom:"Café", pl:"Cafés", emoji:"☕", ajoute:"Café ajouté"},
  {k:"eau",  nom:"Eau",  pl:"Eaux", emoji:"💧", ajoute:"Eau ajoutée"},
  {k:"soft", nom:"Soft", pl:"Softs", emoji:"🥤", ajoute:"Soft ajouté"},
];
const P = Object.fromEntries(PRODUITS.map(x=>[x.k,x]));
const fmtDate = ts => new Date(ts).toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});

/* ---------- Échanges avec le serveur ---------- */
let db = null, jeton = null, mdpParDefaut = false, occupe = false;
// Jeton d'accès au site, gardé sur cet appareil (90 jours).
const CLE_ACCES="popotte-acces";
let acces=null; try{ acces=localStorage.getItem(CLE_ACCES); }catch(_){}
let verrouille=false;
function memoriserAcces(v){ acces=v; try{ v?localStorage.setItem(CLE_ACCES,v):localStorage.removeItem(CLE_ACCES); }catch(_){} }
class Verrou extends Error {}

async function api(chemin, corps){
  if (!acces && chemin!=="acces") { afficherVerrou(); throw new Verrou("Accès verrouillé."); }
  const opts = { method: corps ? "POST" : "GET", headers: {} };
  if (acces) opts.headers["x-acces"] = acces;
  if (corps){ opts.headers["content-type"]="application/json"; opts.body=JSON.stringify(corps); }
  if (jeton) opts.headers.authorization = "Bearer "+jeton;
  let r;
  try { r = await fetch("/api/"+chemin, opts); }
  catch(e){ throw new Error("Pas de connexion réseau. Réessayez."); }
  const d = await r.json().catch(()=>({}));
  if (r.status===401 && d.verrou){ memoriserAcces(null); afficherVerrou(); throw new Verrou(d.erreur); }
  if (r.status===401 && jeton && chemin!=="login"){ jeton=null; adminOk=false; }
  if (!r.ok) throw new Error(d.erreur || "Erreur "+r.status);
  if (d.etat) db = d.etat;
  return d;
}
// Exécute une action en évitant les doubles appuis, et affiche l'erreur éventuelle.
async function action(fn){
  if (occupe) return; occupe=true; document.body.style.cursor="progress";
  try { await fn(); } catch(e){ if(e instanceof Verrou) return; toast(e.message); if(!adminOk && location.hash==="#admin") render(); }
  finally { occupe=false; document.body.style.cursor=""; }
}
const admin = (op, data={}) => api("admin", Object.assign({op}, data));
async function rafraichir(){ db = await api("etat"); }

/* ---------- Calculs ---------- */
const membre = id => db.membres.find(m=>m.id===id);
const nomDe = id => { const m=membre(id); return m?m.nom:"?"; };
const signalementDe = id => (db.signalements||[]).find(x=>x.membreId===id);
const dernierPaiement = id => db.paiements.filter(p=>p.membreId===id).sort((a,b)=>b.ts-a.ts)[0];
const derniereConso = id => db.consos.filter(c=>c.membreId===id).sort((a,b)=>b.ts-a.ts)[0];
// "Payé" : solde réglé, et le dernier mouvement est un paiement.
function regle(id){ const p=dernierPaiement(id), c=derniereConso(id); return solde(id)<=0 && p && (!c || p.ts>=c.ts) ? p : null; }
function totalConso(id){ return db.consos.filter(c=>c.membreId===id).reduce((s,c)=>s+c.prix,0); }
function totalPaye(id){ return db.paiements.filter(p=>p.membreId===id).reduce((s,p)=>s+p.montant,0); }
function solde(id){ return Math.round((totalConso(id)-totalPaye(id))*100)/100; }
function moisStats(id, mk){
  const cs = db.consos.filter(c=>c.membreId===id && monthKey(c.ts)===mk);
  const ps = db.paiements.filter(p=>p.membreId===id && monthKey(p.ts)===mk);
  return {
    n: Object.fromEntries(PRODUITS.map(x=>[x.k, cs.filter(c=>c.type===x.k).length])),
    montant: cs.reduce((s,c)=>s+c.prix,0),
    paye: ps.reduce((s,p)=>s+p.montant,0)
  };
}

/* ---------- UI utilitaires ---------- */
let toastT;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2200); }
function modal(html, onReady){
  const bg=document.createElement("div"); bg.className="modal-bg";
  bg.innerHTML=`<div class="modal">${html}</div>`;
  bg.addEventListener("click",e=>{ if(e.target===bg) bg.remove(); });
  document.body.appendChild(bg); onReady && onReady(bg, ()=>bg.remove());
}
function confirmBox(msg, onYes){
  modal(`<h3>Confirmation</h3><p>${msg}</p><div class="row"><span class="spacer"></span><button data-n>Annuler</button><button class="primary" data-y>Confirmer</button></div>`,
    (el,close)=>{ el.querySelector("[data-n]").onclick=close; el.querySelector("[data-y]").onclick=()=>{close();onYes();}; });
}

let adminOk=false, adminTab="soldes", adminMois=monthKey(Date.now()), idleT;
function resetIdle(){ clearTimeout(idleT); idleT=setTimeout(()=>{ adminOk=false; jeton=null; if(location.hash!=="") go(""); }, 3*60*1000); }
["click","touchstart","keydown"].forEach(ev=>document.addEventListener(ev,resetIdle,{passive:true}));

function go(h){ if(location.hash.slice(1)===h) render(); else location.hash=h; }
window.addEventListener("hashchange", render);
$("#btnHome").onclick=()=>go("");
$("#btnAdmin").onclick=()=>go("admin");

// Rafraîchit l'écran toutes les 20 s (utile si quelqu'un consomme depuis un autre appareil).
setInterval(async()=>{
  if (verrouille || occupe || document.hidden || document.querySelector(".modal-bg") || location.hash==="#admin" && !adminOk) return;
  if (document.activeElement && ["INPUT","SELECT"].includes(document.activeElement.tagName)) return;
  try {
    const avant=(db.signalements||[]).length;
    await rafraichir(); render();
    if(adminOk && (db.signalements||[]).length>avant) toast("🔔 Nouveau paiement signalé");
  } catch(_){}
}, 20000);

function afficherVerrou(){
  document.body.classList.remove("accueil"); verrouille=true; db=null; adminOk=false; jeton=null;
  document.querySelectorAll(".modal-bg").forEach(x=>x.remove());
  $("#btnHome").classList.add("hidden"); $("#btnAdmin").classList.add("hidden"); $("#hdrSub").textContent="";
  app.innerHTML=`<div class="panel" style="max-width:420px;margin:60px auto">
    <h2>🔒 Accès réservé</h2>
    <form id="fv"><label for="pv">Mot de passe de la popotte</label><input type="password" id="pv" autocomplete="current-password" autofocus>
    <div class="row" style="margin-top:14px"><span class="spacer"></span><button class="primary">Entrer</button></div></form>
    <p class="hint">Cet appareil restera déverrouillé pendant 90 jours.</p></div>`;
  $("#fv").onsubmit=e=>{ e.preventDefault(); action(async()=>{
    try{
      const d=await api("acces",{motDePasse:$("#pv").value});
      memoriserAcces(d.acces); verrouille=false;
      $("#btnHome").classList.remove("hidden"); $("#btnAdmin").classList.remove("hidden");
      await rafraichir(); go("");
    }catch(err){ const i=$("#pv"); if(i) i.value=""; throw err; }
  }); };
}

function render(){
  document.body.classList.remove("accueil");
  if (!db || verrouille) return;
  const h=location.hash.slice(1);
  $("#hdrSub").textContent = PRODUITS.map(x=>`${x.nom} ${euro(db.prix[x.k])}`).join(" · ");
  const nb=(db.signalements||[]).length;
  $("#btnAdmin").innerHTML = "Gestionnaire"+(nb?`<span class="badge" title="Paiements signalés à confirmer">${nb}</span>`:"");
  if (h.startsWith("m/")) return renderMembre(h.slice(2));
  if (h==="admin") return adminOk ? renderAdmin() : renderLogin();
  adminOk=false; jeton=null;
  renderHome();
}

/* ---------- Accueil ---------- */
/* ---------- Images des membres ---------- */
const COULEURS=["#6b4226","#1f6f8b","#a33a5c","#2e7d4f","#7b5ea7","#b3541e"];
const cacheAvatars=new Map(); // "id:version" -> data URL
function avatar(m, cls=""){
  if (m.avatar){
    const k=m.id+":"+m.avatar, img=cacheAvatars.get(k);
    return `<span class="avatar ${cls}" data-av="${m.id}" data-v="${m.avatar}">${img?`<img src="${img}" alt="">`:""}</span>`;
  }
  const c=COULEURS[[...m.nom].reduce((h,ch)=>h+ch.charCodeAt(0),0)%COULEURS.length];
  const ini=m.nom.split(/[\s-]+/).filter(Boolean).map(x=>x[0]).join("").slice(0,2).toUpperCase();
  return `<span class="avatar init ${cls}" style="background:${c}">${esc(ini)}</span>`;
}
async function chargerAvatars(){
  for (const el of document.querySelectorAll("[data-av]")){
    if (el.querySelector("img")) continue;
    const k=el.dataset.av+":"+el.dataset.v;
    let img=cacheAvatars.get(k);
    if(!img){ try{ img=localStorage.getItem("av:"+k); }catch(_){} }
    if(!img){
      try{ img=(await api("avatar?id="+encodeURIComponent(el.dataset.av))).image; }catch(_){ continue; }
      try{ localStorage.setItem("av:"+k,img); }catch(_){}
    }
    cacheAvatars.set(k,img);
    document.querySelectorAll(`[data-av="${el.dataset.av}"][data-v="${el.dataset.v}"]`).forEach(x=>{ if(!x.querySelector("img")) x.innerHTML=`<img src="${img}" alt="">`; });
  }
}
// Recadre l'image en carré 256 px (JPEG) pour qu'elle reste légère.
function preparerImage(fichier){
  return new Promise((ok,ko)=>{
    const url=URL.createObjectURL(fichier), im=new Image();
    im.onload=()=>{ const t=256, c=document.createElement("canvas"); c.width=c.height=t;
      const cote=Math.min(im.width,im.height), x=(im.width-cote)/2, y=(im.height-cote)/2;
      const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,t,t); g.drawImage(im,x,y,cote,cote,0,0,t,t);
      URL.revokeObjectURL(url); ok(c.toDataURL("image/jpeg",0.85)); };
    im.onerror=()=>{ URL.revokeObjectURL(url); ko(new Error("Image illisible")); };
    im.src=url;
  });
}

function renderHome(){
  document.body.classList.add("accueil");
  const ms = db.membres.filter(m=>m.actif).sort((a,b)=>a.nom.localeCompare(b.nom,"fr"));
  app.innerHTML = `
    <h2 class="home-title">Touchez votre nom</h2>
    <div class="grid home">${ms.map(m=>{
      const s=solde(m.id), mk=monthKey(Date.now()), st=moisStats(m.id,mk);
      return `<button class="member" data-id="${m.id}">${avatar(m)}<span class="txt">
        <span class="name">${esc(m.nom)}${m.gestionnaire?'<span class="star" title="Gestionnaire">GEST.</span>':''}</span>
        <span class="meta">Ce mois : ${PRODUITS.map(x=>`${st.n[x.k]} ${x.nom.toLowerCase()}`).join(" · ")}</span>
        ${signalementDe(m.id)?`<span class="due wait">⏳ Paiement signalé</span>`
          : regle(m.id)?`<span class="due zero">Payé ✓</span>`
          : `<span class="due ${s<=0?"zero":""}">${s<=0?(s<0?"Avance "+euro(-s):"À jour"):euro(s)}</span>`}
      </span></button>`;}).join("")}
    </div>`;
  app.querySelectorAll(".member").forEach(b=>b.onclick=()=>go("m/"+b.dataset.id));
  chargerAvatars();
}

/* ---------- Compte membre ---------- */
function renderMembre(id){
  const m=membre(id); if(!m) return go("");
  const s=solde(id), mk=monthKey(Date.now()), st=moisStats(id,mk);
  const hist=[
    ...db.consos.filter(c=>c.membreId===id).map(c=>Object.assign({},c,{k:"c"})),
    ...db.paiements.filter(p=>p.membreId===id).map(p=>Object.assign({},p,{k:"p"}))
  ].sort((a,b)=>b.ts-a.ts).slice(0,15);
  const last = db.consos.filter(c=>c.membreId===id).sort((a,b)=>b.ts-a.ts)[0];
  const annulable = last && Date.now()-last.ts < 10*60*1000;
  app.innerHTML = `
    <div class="panel">
      <div class="row"><h2 style="margin:0">${esc(m.nom)}</h2><span class="spacer"></span><button class="small" id="back">← Retour</button></div>
      <div class="big-actions">
        ${PRODUITS.map(x=>`<button class="${x.k}" data-add="${x.k}">${x.emoji} + ${x.nom}<small>${euro(db.prix[x.k])}</small></button>`).join("")}
      </div>
      <div class="stats">
        <div class="stat"><div class="v" style="color:${s>0?"var(--warn)":"var(--ok)"}">${euro(Math.max(s,0))}</div><div class="l">${s<0?"Avance : "+euro(-s):"Reste à payer"}</div></div>
        <div class="stat"><div class="v">${euro(st.montant)}</div><div class="l">Consommé en ${monthLabel(mk)}</div></div>
        ${PRODUITS.map(x=>`<div class="stat"><div class="v">${st.n[x.k]}</div><div class="l">${x.pl} ce mois</div></div>`).join("")}
        <div class="stat"><div class="v">${euro(totalConso(id))}</div><div class="l">Total consommé depuis le début</div></div>
      </div>
      ${annulable?`<div class="row" style="margin-top:14px"><button class="small" id="undo">↩ Annuler mon dernier ajout (${((P[last.type]&&P[last.type].nom)||last.type).toLowerCase()} de ${fmtDate(last.ts)})</button></div>`:""}
    </div>
    ${zonePaiement(id)}
    <div class="panel">
      <h2>Derniers mouvements</h2>
      ${hist.length?`<table><tbody>${hist.map(x=>`<tr><td>${fmtDate(x.ts)}</td><td>${x.k==="c"?`<span class="pill ${x.type}">${(P[x.type]&&P[x.type].nom)||x.type}</span>`:`<span class="pill pay">Paiement</span>`}</td><td class="num">${x.k==="c"?euro(x.prix):"− "+euro(x.montant)}</td></tr>`).join("")}</tbody></table>`:`<p class="hint">Aucun mouvement pour l'instant.</p>`}
    </div>`;
  $("#back").onclick=()=>go("");
  const add=type=>action(async()=>{ await api("conso",{membreId:id,type}); toast(P[type].emoji+" "+P[type].ajoute+" pour "+m.nom); renderMembre(id); });
  app.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>add(b.dataset.add));
  if($("#jaipaye")) $("#jaipaye").addEventListener("click",()=>{
    modal(`<h3>Signaler un paiement</h3><p>Le gestionnaire recevra une notification et confirmera quand il aura bien reçu l'argent.</p>
      <label>Montant payé (€)</label><input type="number" step="0.01" min="0" inputmode="decimal" id="mt" value="${Math.max(s,0).toFixed(2)}">
      <div class="row" style="margin-top:14px"><span class="spacer"></span><button data-n>Annuler</button><button class="ok" data-y>Envoyer</button></div>`,
      (el,close)=>{ el.querySelector("[data-n]").onclick=close; el.querySelector("[data-y]").onclick=()=>{
        const v=Math.round(parseFloat(el.querySelector("#mt").value.replace(",","."))*100)/100;
        if(!(v>0)) return toast("Montant invalide");
        close(); action(async()=>{ await api("signaler",{membreId:id,montant:v}); toast("Paiement signalé au gestionnaire"); render(); }); }; });
  });
  if($("#annulSig")) $("#annulSig").addEventListener("click",()=>{ const sg=signalementDe(id);
    confirmBox("Annuler ton signalement de paiement ?",()=>action(async()=>{ await api("annulerSignalement",{membreId:id,signalementId:sg.id}); toast("Signalement annulé"); render(); })); });
  if(annulable) $("#undo").onclick=()=>action(async()=>{ await api("annuler",{membreId:id,consoId:last.id}); toast("Dernier ajout annulé"); renderMembre(id); });
}

// Zone "J'ai payé", volontairement séparée des boutons de consommation.
function zonePaiement(id){
  const s=solde(id), sg=signalementDe(id), p=regle(id);
  let contenu;
  if (sg) contenu = `<div>⏳ Tu as signalé un paiement de <b>${euro(sg.montant)}</b> le ${fmtDate(sg.ts)}.<br><span class="hint">En attente de confirmation par le gestionnaire.</span></div>
    <span class="spacer"></span><button class="small" id="annulSig">Annuler mon signalement</button>`;
  else if (p) contenu = `<div style="color:var(--ok);font-weight:600">✓ Ta dette est réglée.</div><span class="hint">Paiement de ${euro(p.montant)} confirmé le ${fmtDate(p.ts)}.</span>`;
  else if (s>0) contenu = `<div>Tu as réglé tes ${euro(s)} au gestionnaire ?<br><span class="hint">Préviens-le ici, il confirmera de son côté.</span></div>
    <span class="spacer"></span><button class="ok-outline" id="jaipaye">💶 J'ai payé</button>`;
  else return "";
  return `<div class="panel payzone"><div class="row">${contenu}</div></div>`;
}

/* ---------- Connexion gestionnaire ---------- */
function renderLogin(){
  app.innerHTML=`<div class="panel" style="max-width:420px;margin:40px auto">
    <h2>Espace gestionnaire</h2>
    <form id="f"><label for="pw">Mot de passe</label><input type="password" id="pw" autocomplete="current-password" autofocus>
    <div class="row" style="margin-top:14px"><span class="spacer"></span><button class="primary">Se connecter</button></div></form>
    <p class="hint hidden" id="defHint">Mot de passe par défaut : <b>popotte</b>. Changez-le dans l'onglet Réglages.</p>
  </div>`;
  api("info").then(d=>{ if(d.mdpParDefaut) $("#defHint")&&$("#defHint").classList.remove("hidden"); }).catch(()=>{});
  $("#f").onsubmit=e=>{ e.preventDefault(); action(async()=>{
    try{
      const d=await api("login",{motDePasse:$("#pw").value});
      jeton=d.jeton; mdpParDefaut=d.mdpParDefaut; adminOk=true; resetIdle();
      await rafraichir(); renderAdmin();
    }catch(err){ $("#pw").value=""; throw err; }
  }); };
}

/* ---------- Espace gestionnaire ---------- */
function renderAdmin(){
  const tabs=[["soldes","Paiements"],["mois","Récap mensuel"],["membres","Membres"],["reglages","Réglages"]];
  app.innerHTML=`<div class="tabs no-print">${tabs.map(([k,l])=>`<button data-t="${k}" class="${adminTab===k?"active":""}">${l}</button>`).join("")}
    <span class="spacer"></span><button class="small" id="logout">Se déconnecter</button></div>
    ${notifSignalements()}
    ${mdpParDefaut?`<div class="panel no-print" style="border-color:var(--warn)"><b>Le mot de passe par défaut est encore actif.</b> Changez-le dans l'onglet Réglages.</div>`:""}
    <div id="adm"></div>`;
  app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{adminTab=b.dataset.t;renderAdmin();});
  $("#logout").onclick=()=>{adminOk=false;jeton=null;go("");};
  app.querySelectorAll("[data-conf]").forEach(b=>b.onclick=()=>{
    const sg=db.signalements.find(x=>x.id===b.dataset.conf); if(!sg) return;
    modal(`<h3>Confirmer le paiement de ${esc(nomDe(sg.membreId))}</h3><p class="hint">Montant signalé : ${euro(sg.montant)}. Corrige-le si tu as reçu une autre somme.</p>
      <label>Montant reçu (€)</label><input type="number" step="0.01" min="0" inputmode="decimal" id="mt" value="${sg.montant.toFixed(2)}">
      <div class="row" style="margin-top:14px"><span class="spacer"></span><button data-n>Annuler</button><button class="ok" data-y>Confirmer</button></div>`,
      (el,close)=>{ el.querySelector("[data-n]").onclick=close; el.querySelector("[data-y]").onclick=()=>{
        const v=Math.round(parseFloat(el.querySelector("#mt").value.replace(",","."))*100)/100;
        if(!(v>0)) return toast("Montant invalide");
        close(); adminAction("confirmerSignalement",{signalementId:sg.id,montant:v},"Paiement de "+euro(v)+" confirmé"); }; });
  });
  app.querySelectorAll("[data-refus]").forEach(b=>b.onclick=()=>confirmBox("Refuser ce signalement ? Le membre devra le refaire s'il a bien payé.",
    ()=>adminAction("refuserSignalement",{signalementId:b.dataset.refus},"Signalement refusé")));
  ({soldes:admSoldes,mois:admMois,membres:admMembres,reglages:admReglages})[adminTab]();
}
function notifSignalements(){
  const L=(db.signalements||[]).slice().sort((a,b)=>a.ts-b.ts);
  if(!L.length) return "";
  return `<div class="panel notif no-print"><h2>🔔 ${L.length} paiement${L.length>1?"s":""} signalé${L.length>1?"s":""} à confirmer</h2><ul>
    ${L.map(sg=>{const m=membre(sg.membreId);return `<li><b>${esc(m?m.nom:"?")}</b><span>${euro(sg.montant)}</span><span class="hint">le ${fmtDate(sg.ts)} · reste dû ${euro(solde(sg.membreId))}</span>
      <span class="spacer"></span><button class="small" data-refus="${sg.id}">Refuser</button><button class="small ok" data-conf="${sg.id}">Confirmer</button></li>`;}).join("")}
  </ul></div>`;
}
const adminAction = (op, data, msg) => action(async()=>{ await admin(op,data); if(msg) toast(msg); render(); });

function admSoldes(){
  const ms=db.membres.filter(m=>m.actif||solde(m.id)!==0).sort((a,b)=>solde(b.id)-solde(a.id));
  const tot=ms.reduce((s,m)=>s+Math.max(solde(m.id),0),0);
  const recents=db.paiements.slice().sort((a,b)=>b.ts-a.ts).slice(0,10);
  $("#adm").innerHTML=`<div class="panel"><div class="row"><h2 style="margin:0">Soldes et paiements</h2><span class="spacer"></span><b>Total à encaisser : ${euro(tot)}</b></div>
    <table><thead><tr><th>Membre</th><th class="num">Consommé</th><th class="num">Payé</th><th class="num">Reste dû</th><th></th></tr></thead><tbody>
    ${ms.map(m=>{const s=solde(m.id);return `<tr><td>${esc(m.nom)}${m.gestionnaire?' <span class="hint">(gest.)</span>':''}</td><td class="num">${euro(totalConso(m.id))}</td><td class="num">${euro(totalPaye(m.id))}</td>
      <td class="num" style="font-weight:700;color:${s>0?"var(--warn)":"var(--ok)"}">${euro(s)}</td>
      <td class="num"><button class="small ok" data-pay="${m.id}">Valider un paiement</button></td></tr>`;}).join("")}
    </tbody></table></div>
    <div class="panel"><h2>Derniers paiements validés</h2>${recents.length?`<table><tbody>${recents.map(p=>`<tr><td>${fmtDate(p.ts)}</td><td>${esc(nomDe(p.membreId))}</td><td class="num">${euro(p.montant)}</td><td class="num"><button class="small" data-delp="${p.id}">Annuler</button></td></tr>`).join("")}</tbody></table>`:`<p class="hint">Aucun paiement enregistré.</p>`}</div>`;
  $("#adm").querySelectorAll("[data-pay]").forEach(b=>b.onclick=()=>{
    const m=membre(b.dataset.pay), s=solde(m.id);
    modal(`<h3>Paiement de ${esc(m.nom)}</h3><p class="hint">Reste dû : ${euro(s)}</p>
      <label>Montant reçu (€)</label><input type="number" step="0.01" min="0" inputmode="decimal" id="mt" value="${Math.max(s,0).toFixed(2)}">
      <div class="row" style="margin-top:14px"><span class="spacer"></span><button data-n>Annuler</button><button class="ok" data-y>Valider</button></div>`,
      (el,close)=>{ el.querySelector("[data-n]").onclick=close; el.querySelector("[data-y]").onclick=()=>{
        const v=Math.round(parseFloat(el.querySelector("#mt").value.replace(",","."))*100)/100;
        if(!(v>0)) return toast("Montant invalide");
        close(); adminAction("paiement",{membreId:m.id,montant:v},"Paiement de "+euro(v)+" validé"); }; });
  });
  $("#adm").querySelectorAll("[data-delp]").forEach(b=>b.onclick=()=>confirmBox("Annuler ce paiement ?",()=>adminAction("annulerPaiement",{paiementId:b.dataset.delp},"Paiement annulé")));
}

function moisDisponibles(){
  const set=new Set([monthKey(Date.now()),...db.consos.map(c=>monthKey(c.ts)),...db.paiements.map(p=>monthKey(p.ts))]);
  return [...set].sort().reverse();
}
function lignesMois(mk){
  return db.membres.map(m=>Object.assign({m},moisStats(m.id,mk),{solde:solde(m.id)}))
    .filter(l=>l.m.actif||l.montant||l.paye).sort((a,b)=>a.m.nom.localeCompare(b.m.nom,"fr"));
}
function admMois(){
  const L=lignesMois(adminMois), T=L.reduce((t,l)=>{PRODUITS.forEach(x=>t.n[x.k]+=l.n[x.k]);t.mt+=l.montant;t.p+=l.paye;return t;},{n:Object.fromEntries(PRODUITS.map(x=>[x.k,0])),mt:0,p:0});
  $("#adm").innerHTML=`<div class="panel">
    <div class="row no-print" style="margin-bottom:12px"><select id="mois" style="width:auto">${moisDisponibles().map(k=>`<option value="${k}" ${k===adminMois?"selected":""}>${monthLabel(k)}</option>`).join("")}</select>
      <span class="spacer"></span><button class="small" id="csv">Exporter CSV</button><button class="small primary" id="print">Imprimer</button></div>
    <h2>Récapitulatif — ${monthLabel(adminMois)}</h2>
    <table><thead><tr><th>Membre</th>${PRODUITS.map(x=>`<th class="num">${x.nom}</th>`).join("")}<th class="num">Montant du mois</th><th class="num">Payé ce mois</th><th class="num">Solde actuel</th></tr></thead><tbody>
    ${L.map(l=>`<tr><td>${esc(l.m.nom)}</td>${PRODUITS.map(x=>`<td class="num">${l.n[x.k]}</td>`).join("")}<td class="num">${euro(l.montant)}</td><td class="num">${euro(l.paye)}</td><td class="num"><b>${euro(l.solde)}</b></td></tr>`).join("")}
    <tr><th>Total</th>${PRODUITS.map(x=>`<th class="num">${T.n[x.k]}</th>`).join("")}<th class="num">${euro(T.mt)}</th><th class="num">${euro(T.p)}</th><th></th></tr>
    </tbody></table><p class="hint">Édité le ${new Date().toLocaleString("fr-FR")}</p></div>`;
  $("#mois").onchange=e=>{adminMois=e.target.value;admMois();};
  $("#print").onclick=()=>window.print();
  $("#csv").onclick=()=>{
    const n=v=>v.toFixed(2).replace(".",",");
    const rows=[["Membre",...PRODUITS.map(x=>x.nom),"Montant du mois (€)","Payé ce mois (€)","Solde actuel (€)"],
      ...L.map(l=>[l.m.nom,...PRODUITS.map(x=>l.n[x.k]),n(l.montant),n(l.paye),n(l.solde)]),["Total",...PRODUITS.map(x=>T.n[x.k]),n(T.mt),n(T.p),""]];
    const csv="﻿"+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(";")).join("\r\n");
    download(`popotte-${adminMois}.csv`, csv, "text/csv;charset=utf-8");
  };
}
function download(name, content, type){
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([content],{type})); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}

function admMembres(){
  const ms=db.membres.slice().sort((a,b)=>(b.actif-a.actif)||a.nom.localeCompare(b.nom,"fr"));
  $("#adm").innerHTML=`<div class="panel"><h2>Ajouter un membre</h2>
    <form id="fa" class="row"><input id="nn" placeholder="Nom" style="flex:1;min-width:200px"><button class="primary">Ajouter</button></form></div>
    <div class="panel"><h2>Membres</h2><table><tbody>${ms.map(m=>`<tr>
      <td><span class="mrow">${avatar(m,"sm")}<span>${esc(m.nom)}</span></span> ${m.gestionnaire?'<span class="pill pay">Gestionnaire</span>':''} ${m.actif?'':'<span class="hint">(désactivé)</span>'}</td>
      <td class="num"><div class="row" style="justify-content:flex-end">
        <button class="small" data-img="${m.id}">🖼 Changer l'image</button>
        ${m.avatar?`<button class="small" data-noimg="${m.id}">Retirer l'image</button>`:""}
        <button class="small" data-ren="${m.id}">Renommer</button>
        <button class="small" data-gest="${m.id}">${m.gestionnaire?"Retirer gestionnaire":"Rendre gestionnaire"}</button>
        <button class="small ${m.actif?"danger":""}" data-act="${m.id}">${m.actif?"Désactiver":"Réactiver"}</button>
      </div></td></tr>`).join("")}</tbody></table>
      <p class="hint">Un membre désactivé n'apparaît plus sur l'accueil, mais son historique est conservé.</p>
      <p class="hint">Les images sont recadrées automatiquement en carré. Sans image, la tuile affiche les initiales.</p>
      <input type="file" id="imgIn" accept="image/*" class="hidden"></div>`;
  chargerAvatars();
  let cible=null;
  $("#imgIn").onchange=async e=>{ const f=e.target.files[0]; e.target.value=""; if(!f||!cible) return;
    try{ const image=await preparerImage(f); adminAction("avatar",{membreId:cible,image},"Image enregistrée"); }catch(err){ toast(err.message); } };
  $("#fa").onsubmit=e=>{e.preventDefault();const v=$("#nn").value.trim();if(!v)return;adminAction("ajouterMembre",{nom:v},v+" ajouté");};
  const A=$("#adm");
  A.querySelectorAll("[data-ren]").forEach(b=>b.onclick=()=>{const m=membre(b.dataset.ren);
    modal(`<h3>Renommer</h3><input id="rn" value="${esc(m.nom)}"><div class="row" style="margin-top:14px"><span class="spacer"></span><button data-n>Annuler</button><button class="primary" data-y>Enregistrer</button></div>`,
      (el,close)=>{el.querySelector("[data-n]").onclick=close;el.querySelector("[data-y]").onclick=()=>{const v=el.querySelector("#rn").value.trim();close();if(v)adminAction("renommer",{membreId:m.id,nom:v});};});});
  A.querySelectorAll("[data-img]").forEach(b=>b.onclick=()=>{ cible=b.dataset.img; $("#imgIn").click(); });
  A.querySelectorAll("[data-noimg]").forEach(b=>b.onclick=()=>confirmBox(`Retirer l'image de ${esc(membre(b.dataset.noimg).nom)} ?`,()=>adminAction("retirerAvatar",{membreId:b.dataset.noimg},"Image retirée")));
  A.querySelectorAll("[data-gest]").forEach(b=>b.onclick=()=>adminAction("basculerGestionnaire",{membreId:b.dataset.gest}));
  A.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{const m=membre(b.dataset.act);
    if(m.actif) confirmBox(`Désactiver ${esc(m.nom)} ?`,()=>adminAction("basculerActif",{membreId:m.id})); else adminAction("basculerActif",{membreId:m.id});});
}

function admReglages(){
  $("#adm").innerHTML=`<div class="panel"><h2>Prix</h2>
    <div class="row">${PRODUITS.map(x=>`<div style="flex:1;min-width:140px"><label>${x.nom} (€)</label><input type="number" step="0.01" min="0" inputmode="decimal" data-prix="${x.k}" value="${db.prix[x.k]!=null?db.prix[x.k]:""}"></div>`).join("")}</div>
    <p class="hint">Un nouveau prix ne s'applique qu'aux consommations ajoutées après le changement.</p>
    <button class="primary" id="sp">Enregistrer les prix</button></div>
    <div class="panel"><h2>Mot de passe gestionnaire</h2>
    <label>Nouveau mot de passe</label><input type="password" id="np1" autocomplete="new-password">
    <label>Confirmer</label><input type="password" id="np2" autocomplete="new-password">
    <div style="margin-top:12px"><button class="primary" id="smdp">Changer le mot de passe</button></div></div>
    <div class="panel"><h2>Sauvegarde</h2>
    <p class="hint">Les données sont enregistrées sur Netlify. Une sauvegarde de temps en temps (par exemple à chaque fin de mois) reste une bonne précaution.</p>
    <div class="row"><button class="primary" id="bk">Télécharger une sauvegarde</button>
    <button class="small" id="lockBtn" type="button">🔒 Verrouiller cette tablette</button>
    <button class="small" id="rsBtn" type="button">Restaurer une sauvegarde…</button><input type="file" id="rs" accept=".json,application/json" class="hidden"></div></div>`;
  $("#sp").onclick=()=>{const prix={};for(const i of $("#adm").querySelectorAll("[data-prix]")){const v=parseFloat(i.value.replace(",","."));if(!(v>=0))return toast("Prix invalide");prix[i.dataset.prix]=v;}
    adminAction("prix",prix,"Prix enregistrés");};
  $("#smdp").onclick=()=>{const a=$("#np1").value,b=$("#np2").value;
    if(a.length<4)return toast("4 caractères minimum");if(a!==b)return toast("Les deux mots de passe diffèrent");
    action(async()=>{const d=await api("mdp",{nouveau:a});jeton=d.jeton;mdpParDefaut=false;toast("Mot de passe changé");renderAdmin();});};
  $("#bk").onclick=()=>download(`popotte-sauvegarde-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(db,null,1),"application/json");
  $("#rsBtn").onclick=()=>$("#rs").click();
  $("#lockBtn").onclick=()=>confirmBox("Verrouiller cette tablette ? Il faudra ressaisir le mot de passe de la popotte.",()=>{memoriserAcces(null);afficherVerrou();});
  $("#rs").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{
    try{const d=JSON.parse(r.result);if(!Array.isArray(d.membres)||!Array.isArray(d.consos))throw 0;
      confirmBox("Remplacer toutes les données actuelles par cette sauvegarde ?",()=>adminAction("restaurer",{donnees:d},"Sauvegarde restaurée"));}
    catch(_){toast("Fichier de sauvegarde invalide");}};r.readAsText(f);};
}

/* ---------- Démarrage ---------- */
(async function demarrer(){
  app.innerHTML=`<p class="hint" style="text-align:center;margin-top:60px">Chargement…</p>`;
  for(;;){
    try{ await rafraichir(); render(); return; }
    catch(e){ if(e instanceof Verrou) return; app.innerHTML=`<div class="panel" style="max-width:480px;margin:40px auto;text-align:center"><h2>Connexion impossible</h2><p class="hint">${esc(e.message)}</p><p class="hint">Nouvel essai dans 10 secondes…</p></div>`; }
    await new Promise(r=>setTimeout(r,10000));
  }
})();
</script>
